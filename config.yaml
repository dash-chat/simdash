name: simdash
behavior: ecco
net-top:
  - element: node
    subnet: mesh
    number: 100
    rules:
      - element: link
        strategy: per_node
        count:
          min: 0
          max: 2
        destination:
          selection: random
          subnet: mesh
        ordinality: bidirectional
        longevity: 0
        spawn_chance: 1
  # - element: node
  #   subnet: cloud
  #   number: 1
dash-chat-top:
  storage_capacity_per_node_kb:
    type: fixed
    value: 4000
  rules:
    - type: groups
      subnets: all
      group_amount: 1
      group_size:
        type: fixed
        value: 5
      operations_count:
        type: fixed
        value: 1
