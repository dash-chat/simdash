[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/runner"]

[workspace.dependencies]
anyhow = "1"
paste = "1"
derive_more = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
maplit = { version = "1" }
pretty_assertions = { version = "1" }
petgraph = { version = "0.8", features = ["serde-1"] }
postcard = { version = "1", features = ["use-std"] }
tracing = "0.1"

simdash-ids = { path = "crates/ids" }
simdash-action = { path = "crates/action" }
simdash-behavior = { path = "crates/behavior" }
simdash-model = { path = "crates/model" }
simdash-routing = { path = "crates/routing" }
simdash-routing-common = { path = "crates/routing-common" }
simdash-routing-flooding = { path = "crates/routing-flooding" }
simdash-routing-noop = { path = "crates/routing-noop" }
simdash-runner = { path = "crates/runner" }
simdash-scenario = { path = "crates/scenario" }
simdash-state = { path = "crates/state" }

polestar = { git = "https://github.com/maackle/polestar-rs.git", branch = "main" }
