[workspace]
resolver = "2"
members = ["crates/*", "protocols/*", "simulations"]
default-members = ["crates/runner"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
derive_more = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
maplit = { version = "1" }
named-id = { git = "https://github.com/maackle/named-id.git" }
owo-colors = { version = "4.3.0" }
pretty_assertions = { version = "1" }
petgraph = { version = "0.8", features = ["serde-1"] }
postcard = { version = "1", features = ["use-std"] }
rainbow-brackets = { git = "https://github.com/maackle/rainbow-brackets.git" }
rand = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

simdash-types = { path = "crates/types" }
simdash-model-chat = { path = "crates/model-chat" }
simdash-model-node = { path = "crates/model-node" }
simdash-model-network = { path = "crates/model-network" }
simdash-distribution = { path = "crates/distribution" }
simdash-routing-common = { path = "crates/routing-common" }
simdash-routing-dispatch = { path = "crates/routing-dispatch" }
simdash-runner = { path = "crates/runner" }
simdash-scenario = { path = "crates/scenario" }
simdash-simulation = { path = "crates/simulation" }
net-topology = { path = "crates/net-topology" }
dash-chat-top-gen = { path = "crates/dash-chat-top-gen" }

simdash-protocol-flooding = { path = "protocols/flooding" }
simdash-protocol-flooding-sync = { path = "protocols/flooding-sync" }
simdash-protocol-noop = { path = "protocols/noop" }
simdash-protocol-ecco = { path = "protocols/ecco" }

polestar = { git = "https://github.com/maackle/polestar-rs.git", branch = "main" }

[patch."https://github.com/maackle/polestar-rs.git"]
polestar = { path = "/home/michael/proj/polestar-rs/polestar" }

[patch."https://github.com/maackle/rainbow-brackets.git"]
rainbow-brackets = { path = "/home/michael/proj/rainbow-brackets" }
