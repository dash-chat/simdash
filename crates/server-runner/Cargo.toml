[package]
name = "simdash-server-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simdash-server-runner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
simdash-types = { workspace = true }
simdash-simulation = { workspace = true }
simdash-model-network = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
