[package]
name = "simdash-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simdash-runner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rainbow-brackets = { workspace = true }
serde_json = "1"
simdash-simulation = { path = "../simulation" }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
