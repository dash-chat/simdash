[package]
name = "simdash-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simdash-runner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json = "1"
simdash-simulation = { path = "../simulation" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
