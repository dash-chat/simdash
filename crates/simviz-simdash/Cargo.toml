[package]
name = "simviz-simdash"
version = "0.1.0"
edition = "2024"
description = "Presenter adapter and server binary exposing the simdash model through simviz"

[[bin]]
name = "simviz-simdash"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
polestar = { workspace = true }
polestar-sim = { workspace = true }
serde_json = "1"
serde_yml = "0.0.12"
simviz = { workspace = true }
simdash-generator = { path = "../generator" }
simdash-model-network = { workspace = true }
simdash-simulation = { workspace = true }
simdash-types = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
